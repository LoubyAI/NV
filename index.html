<!DOCTYPE html>
<html lang="is">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nýjar vinkonur</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            💞
        </div>
    </header>


    <main>

        <!-- VINSTRI HLIÐ -->
        <section>

            <div class="intro">
                <h1>Nýjar vinkonur á Íslandi 💞</h1>

                <p>
                    Kynnstu nýjum konum á svipuðum aldri,
                    finndu fólk til að hitta og taka þátt
                    í skemmtilegum viðburðum.
                </p>
            </div>

                <img class="image" src="mynd.jpg" alt="Konur að njóta samveru">
      

        </section>


        <!-- HÆGRI HLIÐ -->
        <section>

            <div class="login">

                <h2>Skráðu þig inn</h2>

                <form action="start.html" id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Netfang eða farsímanúmer"
                         required
                        >

                    <input
                        type="password"
                        id="password"
                        placeholder="Lykilorð"
                         required
                        >
                    

                    <button type="submit">
                        Skrá inn
                    </button>

                </form>

                <p>
                    <a href="#" id="loginMessage">
                        Manstu ekki lykilorðið?
                    </a>
                </p>

                <button type="button">
                    Stofna nýjan aðgang
                </button>

                <p>
                    💞 Nýjar vinkonur
                </p>

            </div>

        </section>

    </main>


    <footer>

    <nav>
        <a href="#">Íslenska</a>
        <a href="#">English</a>
        <a href="#">Polski</a>
        <a href="#">Dansk</a>
        <a href="#">Um okkur</a>
        <a href="#">Persónuvernd</a>
        <a href="#">Skilmálar</a>
        <a href="#">Samband</a>
    </nav>

    <p class="copyright">© 2026 Nýjar vinkonur á Íslandi</p>

</footer>

<script src="script.js"></script>
</body>

</html>
